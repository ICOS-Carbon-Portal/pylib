name: Deploy docs

# Rebuild and publish the MkDocs site whenever the docs source changes on
# master. The built HTML is pushed to the gh-pages branch, which GitHub
# Pages serves at https://icos-carbon-portal.github.io/pylib/.
on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:        # allows a manual run from the Actions tab

# Let the workflow's token push the built site to the gh-pages branch.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # gh-deploy needs full history to update gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs==1.6.1   # readthedocs theme ships with it

      - name: Build and deploy to gh-pages
        run: mkdocs gh-deploy --force --remote-branch gh-pages
